<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arch Linux Automated Setup Wizard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
        <h1 class="text-3xl font-extrabold text-sky-400 mb-2 tracking-tight">Arch Linux Setup Wizard</h1>
        <p class="text-slate-400 text-sm mb-6">Configure your custom automated archinstall profile.</p>

        <form id="wizardForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold uppercase tracking-wider text-slate-300 mb-2">CPU Architecture</label>
                <select id="cpu" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="amd">AMD CPU</option>
                    <option value="intel">Intel CPU</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold uppercase tracking-wider text-slate-300 mb-2">Graphics Card (GPU)</label>
                <select id="gpu" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="nvidia-pascal">NVIDIA Pascal (GTX 10-series / Legacy Drivers)</option>
                    <option value="nvidia-modern">NVIDIA Modern (RTX series / Current Drivers)</option>
                    <option value="amd-gpu">AMD Radeon Graphics</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold uppercase tracking-wider text-slate-300 mb-2">Desktop Environment</label>
                <select id="desktop" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="kde-plasma">KDE Plasma (X11 Display Server)</option>
                    <option value="gnome">GNOME</option>
                    <option value="xfce">XFCE (Lightweight)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold uppercase tracking-wider text-slate-300 mb-2">Linux Kernel</label>
                <select id="kernel" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500">
                    <option value="linux-lts">Linux LTS (Recommended for stability/NVIDIA)</option>
                    <option value="linux-stable">Linux Standard Stable</option>
                </select>
            </div>

            <button type="button" onclick="generateConfig()" class="w-full bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg">
                Generate Configuration File
            </button>
        </form>

        <div id="resultBlock" class="mt-8 pt-6 border-t border-slate-700 hidden">
            <p class="text-emerald-400 font-semibold mb-2">✓ Configuration Generated Successfully!</p>
            <p class="text-xs text-slate-400 mb-3">Copy this URL to use directly inside your target machine's archinstall command:</p>
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 break-all select-all font-mono text-sm text-sky-400" id="configUrl">
                Generating...
            </div>
        </div>
    </div>

    <script>
        async function generateConfig() {
            const payload = {
                cpu: document.getElementById('cpu').value,
                gpu: document.getElementById('gpu').value,
                desktop: document.getElementById('desktop').value,
                kernel: document.getElementById('kernel').value
            };

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('configUrl').innerText = window.location.origin + data.path;
                    document.getElementById('resultBlock').classList.remove('hidden');
                } else {
                    alert('Error creating setup config.');
                }
            } catch (err) {
                alert('Could not connect to the backend server.');
            }
        }
    </script>
</body>
</html>
